# 每个 PR 检查代码（pyflakes）并运行全部测试（单元测试 + 端到端测试）；本仓库 DEV 发来的 PR 除外（见下方 if）。
# 推送到 main / DEV / 打标签时由 docker.yml 调用（workflow_call），测试通过才构建镜像。
# 端到端测试用本地模拟的 Bot API 服务器运行真实的机器人进程，不需要 token、密钥或外网。约 10 分钟。
name: test

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 本仓库 DEV → main 的 PR 不重跑：推送到 DEV 时 docker.yml 已经对同一个提交跑过（PR 上显示为 “test / test”）。
    # 其他分支和 fork 发来的 PR 照常运行
    if: >-
      github.event_name != 'pull_request'
      || github.head_ref != 'DEV'
      || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25  # 全部测试约 10 分钟，并且随功能增加；留足余量，免得超时被当成测试失败
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # 和 Dockerfile 的基础镜像一致
          cache: pip

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q bot tests

      # 不运行代码，只找明显的错误：未定义的名字、没用到的 import 和变量等（不管代码风格）
      - name: Lint
        run: python -m pyflakes bot tests

      # 每个测试文件单独运行（各自是独立脚本），全部跑完后再汇总失败的文件
      - name: Run tests
        run: |
          failed=""
          for f in tests/test_*.py tests/live_*.py; do
            echo "::group::$f"
            python "$f" || failed="$failed $f"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failed:$failed"
            exit 1
          fi
