services:
  bot:
    build: .
    # 默认在本机构建（自动匹配 amd64 / arm64）。
    # 如果用预构建的多架构镜像，在 .env 里设置 IMAGE=ghcr.io/<你>/tg-submit-bot:latest，
    # 然后 docker compose pull && docker compose up -d --no-build
    image: ${IMAGE:-tg-submit-bot:latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
