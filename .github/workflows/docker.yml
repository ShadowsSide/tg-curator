# 推送到 DEV 或打 v* 标签时先跑完整测试（test.yml），通过后构建 amd64 + arm64 镜像并发布：
#   - 标签：DEV → dev（合并前在服务器上试新功能）；v* 标签 → 同名，正式版（不带 -，如 v1.2.0）同时更新 latest。
#     main 推送不触发：main 只通过 DEV → main 的 PR 更新，合并结果和测过的 DEV 是同一份代码，合并后 DEV 又会快进到 main，
#     再跑一遍是重复的；:dev 就是 main 的代码。不打 sha-xxxxxxx：回滚用版本号
#   - GHCR（始终）：ghcr.io/<owner>/tg-curator
#   - Docker Hub（可选）：在仓库 Settings → Secrets and variables → Actions 中
#       Variables 添加 DOCKERHUB_USERNAME，Secrets 添加 DOCKERHUB_TOKEN 后自动启用
name: docker

on:
  push:
    branches: [DEV]
    tags: ["v*"]
  workflow_dispatch:

# 同一分支 / 标签连续推送时只保留最新一次：并行的话后完成的会覆盖 dev 标签，可能是旧的那次
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  # 合并 PR 后 DEV 快进到 main 的合并提交：代码和上一次推送到 DEV 的完全一样，那次已经测过并出了 :dev，
  # 这次不再测试、不再构建（:dev 保持不变）。只在上一次推送的运行成功时才跳过，被取消或失败的照常跑
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # 查上一次推送的运行结果
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/DEV ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git diff --quiet "$BEFORE" HEAD; then
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/runs?branch=DEV&head_sha=$BEFORE&status=success" --jq .total_count) || ok=0  # 查询失败就照常跑
            if [ "$ok" -gt 0 ]; then
              run=false
              echo "::notice::代码和上一次推送（${BEFORE:0:7}）相同，那次已通过测试并构建，跳过"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # 测试没通过就不发布：部署默认拉取 latest（最新的正式版），有问题的版本会直接到用户的服务器上
  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: test
    # 只有 DEV 和 v* 标签出镜像。在别的分支（比如 main）上手动运行只跑测试：那里一个标签都不会有，推送会失败
    if: github.ref == 'refs/heads/DEV' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # latest 只跟随正式发布：合并进 main 的代码要等打了 v* 标签才会到默认部署；预发布（v1.3.0-rc1）不算
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/tg-curator
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/tg-curator,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/DEV' }}
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false  # 不生成构建证明：否则每个镜像多出两个 unknown/unknown 条目
          cache-from: type=gha
          cache-to: type=gha,mode=max
