# 推送到 main、DEV 或打 v* 标签时，先跑完整测试（test.yml），通过后构建 amd64 + arm64 镜像并发布：
#   - 标签：main → latest；DEV → dev（合并前在服务器上试新功能）；v* 标签 → 同名；每次构建另有 sha-xxxxxxx
#   - GHCR（始终）：ghcr.io/<owner>/tg-curator
#   - Docker Hub（可选）：在仓库 Settings → Secrets and variables → Actions 中
#       Variables 添加 DOCKERHUB_USERNAME，Secrets 添加 DOCKERHUB_TOKEN 后自动启用
name: docker

on:
  push:
    branches: [main, DEV]
    tags: ["v*"]
  workflow_dispatch:

# 同一分支 / 标签连续推送时只保留最新一次：并行的话后完成的会覆盖 dev / latest 标签，可能是旧的那次
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  # 测试没通过就不发布：部署默认拉取 latest，有问题的版本会直接到用户的服务器上
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/tg-curator
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/tg-curator,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/DEV' }}
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
